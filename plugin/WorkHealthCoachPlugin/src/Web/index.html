<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk Coach</title>
<style>
:root{
  --bg:#f2f4f7;--panel:#fff;--panel2:#f6f8fb;--line:#e3e7ee;--text:#151a24;--muted:#667085;
  --accent:#00b89c;--accent-ink:#06352d;--accent-soft:#d9f5ef;--danger:#e5484d;--warn:#f5a524;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1218;--panel:#181c25;--panel2:#1f2430;--line:#2a303d;--text:#eef1f6;--muted:#98a1b3;
    --accent:#19d3b5;--accent-ink:#04201b;--accent-soft:#12312c;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1218;--panel:#181c25;--panel2:#1f2430;--line:#2a303d;--text:#eef1f6;--muted:#98a1b3;
  --accent:#19d3b5;--accent-ink:#04201b;--accent-soft:#12312c;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
img.px{image-rendering:pixelated;display:block}
.app{display:grid;grid-template-columns:210px minmax(0,1fr) 290px;height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-weight:700;font-size:16px}
.brand img{width:30px;height:30px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;border:0;background:none;text-align:left;color:var(--muted);font-weight:600;width:100%}
.nav:hover{background:var(--panel2);color:var(--text)}
.nav.on{background:var(--accent-soft);color:var(--text)}
.nav svg{width:18px;height:18px;flex:none}
.side .sp{flex:1}
.theme{font-size:12px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
main{overflow:auto;padding:26px 28px 60px}
.rail{background:var(--panel);border-left:1px solid var(--line);padding:18px 16px;overflow:auto}
h1{font-size:24px;margin:0 0 2px;letter-spacing:-.01em}
h2{font-size:15px;margin:0}
.sub{color:var(--muted);margin:0 0 18px}
.top{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.top .grow{flex:1;min-width:240px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.chip.warn i{background:var(--warn)}
.note{background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;color:var(--muted);font-size:12.5px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;transition:opacity .2s}
.card.off .ico{filter:grayscale(1) opacity(.55)}
.card.off .chs{opacity:.5}
.card .head{display:flex;gap:12px;align-items:center}
.card .ico{width:48px;height:48px;background:var(--panel2);border-radius:12px;padding:4px;border:1px solid var(--line)}
.card .ico img{width:100%;height:100%}
.card .ttl{flex:1;min-width:0}
.card .ttl b{display:block;font-size:15px}
.card .ttl span{color:var(--muted);font-size:12.5px}
.sum{color:var(--muted);font-size:12.5px}
.chs{display:flex;gap:8px;align-items:center}
.chb{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;color:var(--muted)}
.chb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chb:hover{border-color:var(--accent)}
.cardfoot{display:flex;gap:8px;align-items:center;justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--panel2);padding:7px 14px;border-radius:10px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.ghost{background:none}
.btn.danger{color:var(--danger)}
.sw{width:42px;height:24px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.card.concept{border-style:dashed;box-shadow:none;opacity:.85}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.kp.mini.timer .key{width:auto;height:58px}.kp.mini.timer .span2{grid-column:span 2}.kp.mini.timer .span3{grid-column:span 3}
.kt{font-weight:800;font-size:12px;letter-spacing:.04em;color:#cfd6e4;text-align:center;line-height:1.15}
.kt small{display:block;font-size:9px;color:#98a1b3;font-weight:600}
.kt.big{font:800 30px ui-monospace,Menlo,monospace;letter-spacing:.02em}
.sw.sm{width:34px;height:20px}.sw.sm::after{width:14px;height:14px}.sw.sm[aria-checked="true"]::after{transform:translateX(14px)}
.crumb{display:flex;align-items:center;gap:8px;color:var(--muted);margin-bottom:10px}
.crumb button{background:none;border:0;color:var(--muted);font-weight:600;padding:0}
.crumb button:hover{color:var(--text)}
.dhead{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.dhead .ico{width:56px;height:56px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px}
.dhead .ico img{width:100%;height:100%}
.dhead .grow{flex:1}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.sec>.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sec .sd{color:var(--muted);font-size:12.5px;margin:0 0 8px}
.grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px;font-weight:700}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,300px);gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row.dis{opacity:.4;pointer-events:none}
.row .lbl b{font-weight:600}
.row .lbl small{display:block;color:var(--muted);font-size:12px}
.ctl{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.ctl input[type=range]{flex:1;min-width:90px;accent-color:var(--accent)}
.ctl output{min-width:62px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.rs{border:0;background:none;color:var(--muted);font-size:15px;padding:0 2px;visibility:hidden}
.rs.chg{visibility:visible}
select,input[type=text]{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-width:0}
input[type=text]{width:100%}
.tabs{display:flex;gap:6px;margin:6px 0 12px;flex-wrap:wrap}
.tab{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:600}
.tab svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.tab .dot.on{background:var(--accent)}
.pane{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel2)}
.pane .en{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.pane.dim .body{opacity:.4;pointer-events:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:7px 12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:10px 0}
.opt{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt b{font-size:13px}.opt small{color:var(--muted);font-size:11.5px}
.opt svg.wave{width:100%;height:24px;margin-top:4px}
.opt svg.wave rect{fill:var(--accent)}
.sw-colors{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.col{width:30px;height:30px;border-radius:9px;border:2px solid transparent;box-shadow:0 0 0 1px var(--line)}
.col.sel{border-color:var(--text)}
.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.dclock{font:700 44px ui-monospace,Menlo,monospace;letter-spacing:-.02em}.dclock.over{color:var(--danger)}
.dtrack{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:12px}.dtrack div{height:100%;width:0;background:var(--accent);transition:width .4s}
.dseg{transition:opacity .2s}.dseg.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}.dseg.done{opacity:.5}
.dsay{font-size:17px;line-height:1.5;margin:6px 0 10px}.dlist{margin:0 0 6px;padding-left:20px;color:var(--muted)}.dlist li{margin:3px 0}
.thumb{max-height:70px;max-width:140px;border-radius:8px;border:1px solid var(--line)}
.fname{color:var(--muted);font-size:12.5px}
.rec{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite}
kbd{background:var(--panel);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:2px 7px;font:600 12.5px ui-monospace,Menlo,monospace}
.pomo{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.pomo .time{font:700 44px ui-monospace,Menlo,monospace;letter-spacing:-.02em}
.pomo .ph{color:var(--muted);font-weight:600}
.warnbox{color:var(--warn);font-size:12.5px}
/* keypad */
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:#0b0d12;padding:12px;border-radius:18px;border:1px solid #2a303d;width:max-content}
.key{position:relative;width:74px;height:74px;border-radius:12px;background:#1a1e29;border:1px solid #2a303d;display:grid;place-items:center;overflow:hidden;padding:0}
.key:hover{border-color:var(--accent)}
.key img{width:42px;height:42px}
.key .fx{position:absolute;inset:0;opacity:0;pointer-events:none;background-size:cover;background-position:center}
.key .fx.on{opacity:1}
.key .fx.pulse{animation:pulse 1.2s ease-in-out infinite}
.key .fx.blink{animation:blink 1s steps(1) infinite}
.kp.mini .key{width:58px;height:58px}.kp.mini .key img{width:32px;height:32px}
.kp.big .key{width:96px;height:96px}.kp.big .key img{width:54px;height:54px}
.kl{font-size:10px;color:#98a1b3;position:absolute;bottom:2px;left:0;right:0;text-align:center;pointer-events:none}
.keywrap{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.keywrap select{font-size:11.5px;padding:4px 6px;width:100%;min-width:130px}
.kpgrid{display:grid;grid-template-columns:repeat(3,auto);gap:14px;width:max-content}
.cols2{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:start}
@media(max-width:900px){.cols2{grid-template-columns:1fr}}
/* rail */
.rail h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
.rail section{margin-bottom:22px}
.mouse{display:flex;align-items:center;gap:12px}
.mouse svg{width:56px;height:76px;stroke:var(--text);fill:none;stroke-width:1.6}
.mouse .wf{font-size:12px;color:var(--muted)}
.spk{display:flex;align-items:center;gap:10px;color:var(--muted)}
.spk svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.spk.play{color:var(--accent);animation:pulse .6s infinite}
.log{list-style:none;margin:0;padding:0;font-size:12.5px;color:var(--muted)}
.log li{padding:5px 0;border-top:1px solid var(--line)}
.log li:first-child{border-top:0}
.log b{color:var(--text);font-weight:600}
/* notifications */
#toasts{position:fixed;inset:0;pointer-events:none;z-index:50}
.toast{position:absolute;width:340px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.28);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;animation:slidein .25s ease-out;pointer-events:auto}
.toast.top-right{top:16px;right:16px}.toast.top-center{top:16px;left:calc(50% - 170px)}.toast.bottom-right{bottom:16px;right:16px}
.toast .ti{width:38px;height:38px;border-radius:9px;background:var(--panel2);padding:3px;flex:none}
.toast .ti img{width:100%;height:100%}
.toast .tapp{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:block}
.toast b{display:block;font-size:14px}
.toast p{margin:1px 0 0;color:var(--muted)}
.toast img.media{display:block;max-width:100%;max-height:150px;border-radius:10px;margin-top:8px}
.banner{position:absolute;top:0;left:0;right:0;padding:14px 22px;background:linear-gradient(90deg,var(--accent),#3da5ff);color:#04201b;font-weight:700;font-size:16px;display:flex;align-items:center;gap:12px;animation:slidedown .25s ease-out}
.banner img.ti{width:30px;height:30px}.banner img.media{max-height:46px;border-radius:6px}
.edge{position:absolute;inset:0;box-shadow:inset 0 0 0 6px var(--accent),inset 0 0 90px 10px var(--accent);animation:edge 1.4s ease-in-out infinite;display:grid;place-items:end center}
.edge span{margin-bottom:60px;background:var(--panel);border:1px solid var(--line);padding:10px 18px;border-radius:999px;font-weight:700;box-shadow:var(--shadow)}
.edge span img.media{max-height:60px;display:block;margin:6px auto 0;border-radius:8px}
@keyframes slidein{from{transform:translateY(-12px);opacity:0}}
@keyframes slidedown{from{transform:translateY(-100%)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes blink{50%{opacity:0}}
@keyframes edge{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.key .fx.pulse,.key .fx.blink,.edge{animation:none}}
@media(max-width:1150px){.app{grid-template-columns:200px minmax(0,1fr)}.rail{display:none}}
@media(max-width:760px){.app{grid-template-columns:1fr;height:auto}.side{flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}.brand{display:none}main{padding:18px 16px 50px}.row{grid-template-columns:1fr}.ctl{justify-content:flex-start}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main id="main"></main>
  <aside class="rail" id="rail"></aside>
</div>
<div id="toasts"></div>

<script>
"use strict";
/* ============ constants ============ */
const CH = ["audio","screen","haptic","keypad"];
const CH_LABEL = {audio:"Audio signal",screen:"Screen notification",haptic:"Mouse haptics",keypad:"Keypad colour"};
const CH_SHORT = {audio:"Audio",screen:"Screen",haptic:"Haptics",keypad:"Keypad"};
const SVG = {
  audio:'<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></svg>',
  screen:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
  haptic:'<svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="5"/><path d="M12 3v6M3 9l-1 3 1 3M21 9l1 3-1 3"/></svg>',
  keypad:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="9.5" y="3" width="5" height="5" rx="1"/><rect x="16" y="3" width="5" height="5" rx="1"/><rect x="3" y="9.5" width="5" height="5" rx="1"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><rect x="16" y="9.5" width="5" height="5" rx="1"/><rect x="3" y="16" width="5" height="5" rx="1"/><rect x="9.5" y="16" width="5" height="5" rx="1"/><rect x="16" y="16" width="5" height="5" rx="1"/></svg>',
  dash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>',
  prof:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>'
};
const SOUNDS = [["chime","Chime"],["ping","Ping"],["knock","Soft knock"],["alert","Double beep"],["rise","Rising"],["bell","Bell"]];
const HAPTICS = {
  tap:{name:"Tap",desc:"Short, crisp pulse",wf:"sharp_state_change",p:[60]},
  bump:{name:"Bump",desc:"Soft impact",wf:"damp_collision",p:[90,40,50]},
  alert:{name:"Alert",desc:"Attention grabbing",wf:"angry_alert",p:[70,50,70,50,70]},
  jingle:{name:"Jingle",desc:"Friendly, musical",wf:"jingle",p:[40,30,40,30,80,30,120]}
};
const COLORS = ["#ff4d4f","#ffb020","#ffd43b","#2ee6a8","#3da5ff","#9b6bff","#ff6bd6","#ffffff"];

/* ============ feature definitions (recommended defaults) ============ */
/* NOTE: numbers are research-based placeholders; replace with the team's agreed values. */
const MAC=/Mac/i.test(navigator.platform||"");
const BEHIND_ACTS=["Only notify me","Hide windows (my shortcut)","Lock the screen"];
const FEATURES = [
 {id:"speed",name:"Speech speed",blurb:"Warns when you talk too fast or too slow.",
  params:[
   {g:"Target",k:"target",label:"Target rate",unit:" wpm",min:80,max:220,step:5,def:140,help:"Comfortable presenting pace. Most guides say 120–160."},
   {k:"fast",label:"“Too fast” above",unit:" wpm",min:100,max:260,step:5,def:170},
   {k:"slow",label:"“Too slow” below",unit:" wpm",min:50,max:200,step:5,def:110},
   {k:"window",label:"Measure over",unit:" s",min:5,max:60,step:5,def:15,help:"Rolling window, so one quick sentence does not trigger."}],
  texts:[["text","Too fast message","Slow down"],["text2","Too slow message","Pick up the pace a little"]],
  cd:{def:30,min:5,max:300},def:{on:true,ch:{screen:1},sound:"ping",haptic:"bump",color:"#ffb020",effect:"pulse"}},
 {id:"volume",name:"Speech volume",blurb:"Keeps your voice at a comfortable level.",
  params:[
   {g:"Comfortable range",k:"quiet",label:"Volume floor (calibrated)",unit:" dB",min:30,max:80,step:1,def:50,help:"Set by calibrating: speak normally for 10 s. Below this = “speak up”."},
   {k:"loud",label:"“Too loud” above",unit:" dB",min:50,max:100,step:1,def:75},
   {k:"window",label:"Measure over",unit:" s",min:3,max:30,step:1,def:10}],
  texts:[["text","Too quiet message","Speak up a little"],["text2","Too loud message","Lower your voice"]],
  cd:{def:30,min:5,max:300},def:{on:true,ch:{screen:1},sound:"knock",haptic:"bump",color:"#3da5ff",effect:"pulse"}},
 {id:"blink",name:"Eye blinking",blurb:"A quiet nudge when you blink too little.",

const KEY = "deskcoach.v1";
function makeFeature(d){
  const params={}; d.params.forEach(p=>params[p.k]=p.def);
  const texts={}; d.texts.forEach(t=>texts[t[0]]=t[2]);
  const ch={}; CH.forEach(c=>ch[c]=!!d.def.ch[c]);
  return {enabled:d.def.on,ch,cooldown:d.cd.def,params,
    fb:{audio:{src:"builtin",sound:d.def.sound,file:null,fname:"",rec:null,volume:80},
        screen:{style:"popup",pos:"top-right",texts,img:null,imgName:"",dur:5},
        haptic:{pattern:d.def.haptic,repeat:1},
        keypad:{mode:"color",color:d.def.color,img:null,imgName:"",effect:d.def.effect,dur:6}}};
}
function defaults(){
  const features={}; FEATURES.forEach(d=>features[d.id]=makeFeature(d));
  return {master:true,profile:"everyday",theme:"auto",features,
    keymap:["speed","volume","blink","brightness","pomodoro","distance","behind","master","present"]};
}
function merge(a,b){ if(b===undefined||b===null) return a;
  if(typeof a!=="object"||a===null||Array.isArray(a)) return b;
  const o={...a}; for(const k in b) o[k]=k in a?merge(a[k],b[k]):b[k]; return o; }
let S=defaults(), saveWarn=false;
try{ const raw=localStorage.getItem(KEY); if(raw) S=merge(defaults(),JSON.parse(raw)); }catch(e){}
function fixS(){ const p=S.features.behind&&S.features.behind.params; if(p&&!BEHIND_ACTS.includes(p.act)) p.act="Only notify me"; }
fixS();
function save(){ S.muted=(PROFILES[S.profile]||{}).mute||[]; try{ localStorage.setItem(KEY,JSON.stringify(S)); saveWarn=false; }catch(e){ saveWarn=true; } if(remote) schedulePush(); }

/* ---- connection to the Coach plugin (page served by the plugin at http://127.0.0.1:8787/) ----
   When the page is opened from the plugin, settings, the Pomodoro timer and the haptic/keypad tests go to the real devices.
   Opened as a plain file it stays a preview and keeps everything in the browser. */
let remote=false, lastRev=0, pushT=null;
const TRIG={speed:["pace_too_fast","pace_too_fast"],volume:["speak_up","speak_down"],blink:["blink_low","blink_low"],pomodoro:["break_due","break_over"],distance:["volume_far","volume_far"],behind:["person_behind","person_behind"]};
const JSONH={"Content-Type":"application/json"};
function schedulePush(){ clearTimeout(pushT); pushT=setTimeout(pushNow,250); }
async function pushNow(){ clearTimeout(pushT); if(!remote) return;
  try{ const r=await fetch("/ui-state",{method:"POST",headers:JSONH,body:JSON.stringify(S)}); const j=await r.json(); if(j.rev) lastRev=j.rev; }
  catch(e){ remote=false; renderAll(); } }
function busyEditing(){ const a=document.activeElement; return !!(a&&a.closest&&a.closest("#main")&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)); }
async function pollState(){ if(!remote) return;
  try{ const j=await (await fetch("/ui-state")).json(); if(j.rev&&j.rev!==lastRev&&!busyEditing()){ S=merge(defaults(),j); fixS(); lastRev=j.rev; applyTheme(); renderAll(); } }catch(e){} }
function applyPomo(j){ const P=ui.pomo; if(!P||!j||!j.phase) return; const was=P.away;
  P.phase=j.phase; P.round=j.round; P.left=j.left; P.run=j.running; P.away=!j.atDesk; ui.keyTimer=j.active; pomoPaint();
  if(was!==P.away&&ui.route==="f/pomodoro") renderMain(); }
async function pollPomo(){ if(!remote) return; try{ applyPomo(await (await fetch("/pomodoro")).json()); }catch(e){} }
function plugPost(path,body){ return fetch(path,{method:"POST",headers:JSONH,body:body?JSON.stringify(body):undefined}).then(r=>r.json()).then(applyPomo).catch(()=>{}); }
async function plugDeliver(id,tk,chans){ await pushNow(); const name=TRIG[id][tk==="text2"?1:0];
  for(const only of chans.filter(c=>c==="haptic"||c==="keypad")){ try{ await fetch("/trigger",{method:"POST",headers:JSONH,body:JSON.stringify({trigger:name,severity:1,force:true,only})}); }catch(e){} } }
/* ---- person behind: scripted walkers instead of a camera. The real detector sends the same samples:
   POST /behind {"id":2,"x":0.62,"size":0.07}  (x 0..1 across the picture, size = face width / picture width) ---- */
let bhTimer=null;
function bhStop(){ if(bhTimer){ clearInterval(bhTimer); bhTimer=null; } }
function bhRun(kind){
  if(!remote) return; bhStop();
  if(kind==="none"){ fetch("/behind/clear",{method:"POST"}).catch(()=>{}); return; }
  const id=Math.floor(Date.now()/1000)%100000, t0=Date.now();
  const plan={pass:{secs:3.2,f:t=>[0.02+0.3*t,0.06]},come:{secs:5,f:t=>[0.5,0.03+0.02*t]},stand:{secs:8,f:t=>[0.55+0.01*Math.sin(t),0.07]}}[kind];
  bhTimer=setInterval(()=>{ const t=(Date.now()-t0)/1000; if(t>plan.secs){ bhStop(); return; } const [x,size]=plan.f(t);
    fetch("/behind",{method:"POST",headers:JSONH,body:JSON.stringify({id,x,size})}).catch(()=>{}); },125);
}

async function pollBehind(){
  if(!remote||ui.route!=="f/behind") return;
  try{
    const j=await (await fetch("/behind")).json(), el=$("#bhstat"); if(!el) return;
    const lines=j.tracks.length?j.tracks.map(t=>"Person "+t.id+": "+t.verdict+" (seen "+t.seen+" s)"):["Nobody in view"];
    const flags=[j.hidden&&"screen hidden",j.talk&&"talk mode on",j.musicPaused&&"music paused",j.ack&&"dismissed for a minute"].filter(Boolean);
    if(j.lastAlert) lines.push("Last alert: "+j.lastAlert);
    if(flags.length) lines.push(flags.join(" · "));
    if(j.history.length) lines.push("Before: "+j.history.slice(-3).join("; "));
    el.textContent=lines.join("\n");
  }catch(e){}
}

function farSend(){ if(remote&&!ui.farAway) fetch("/distance",{method:"POST",headers:JSONH,body:JSON.stringify({ratio:ui.farRatio/100})}).catch(()=>{}); }

async function pollFar(){
  if(!remote||ui.route!=="f/distance") return;

  try{
    const j=await (await fetch("/distance")).json(), el=$("#farstat"); if(!el) return;

function demoElapsed(){ return demo.run?demo.at+(Date.now()-demo.t0)/1000:demo.at; }
function demoPaint(){
  const el=demoElapsed(), k=demoIndex(), c=$("#dclock"); if(!c) return;
  c.textContent=fmtClock(Math.min(el,DEMO_TOTAL))+" / 10:00"; c.classList.toggle("over",el>DEMO_TOTAL);
  const bar=$("#dbar"); if(bar) bar.style.width=Math.min(100,el/DEMO_TOTAL*100)+"%";

  try{
    const r=await fetch("/ui-state"); if(!r.ok) throw new Error("no plugin"); const j=await r.json(); remote=true;
    const complete=j.features&&j.features.speed&&j.features.speed.cooldown!==undefined&&j.features.pomodoro&&j.features.pomodoro.params;
    if(j.features){ S=merge(defaults(),j); fixS(); lastRev=j.rev||0; applyTheme(); }
    if(!complete){ S.muted=(PROFILES[S.profile]||{}).mute||[]; await pushNow(); }

/* ---- feedback engine ---- */
function fire(id,o={}){
  const f=S.features[id], d=F[id], tk=o.text||"text";
  if(d.concept){ addLog(d.name+": <b>concept</b>, not built yet"); return false; }
  if(!o.force){
    if(!S.master||!f.enabled){ addLog(d.name+": <b>ignored</b> (off)"); return false; }
    const left=f.cooldown*1000-(Date.now()-(last[id]||0));
    if(left>0){ addLog(d.name+": <b>cooldown</b> "+Math.ceil(left/1000)+" s left"); return false; }
  }
  last[id]=Date.now();
  const mute=(o.force||!PROFILES[S.profile])?[]:PROFILES[S.profile].mute;
  const chans=CH.filter(c=>(o.only?c===o.only:f.ch[c])&&!mute.includes(c));
  chans.forEach(c=>({audio:playAudio,screen:showScreen,haptic:doHaptic,keypad:flashKey})[c](id,tk));
  if(remote) plugDeliver(id,tk,chans);
  addLog("<b>"+d.name+"</b> → "+(chans.length?chans.map(c=>CH_SHORT[c]).join(" + "):"silent")+(mute.length&&!o.force?" (muted: "+mute.join(", ")+")":""));
  return true;
}
function playAudio(id){
  const c=S.features[id].fb.audio;
  let src=c.src==="upload"?c.file:c.src==="record"?c.rec:null;
  if(!src) src="assets/sounds/"+c.sound+".wav";
  const a=new Audio(src); a.volume=Math.max(0,Math.min(1,c.volume/100));
  const sp=$("#spk"); if(sp){ sp.classList.add("play"); a.onended=()=>sp.classList.remove("play"); setTimeout(()=>sp.classList.remove("play"),4000); }
  a.play().catch(()=>addLog("Audio blocked by browser. Click anywhere first."));
}
function showScreen(id,tk){
  const f=S.features[id], c=f.fb.screen, d=F[id];

function doHaptic(id){
  const c=S.features[id].fb.haptic, h=HAPTICS[c.pattern]||HAPTICS.tap;
  let seq=[]; for(let i=0;i<c.repeat;i++) seq=seq.concat(h.p,i<c.repeat-1?[250]:[]);
  const m=$("#mouse"); if(m&&m.animate){
    let t=0,tot=seq.reduce((a,b)=>a+b,0)||1; const kf=[{transform:"translateX(0)",offset:0}];
    seq.forEach((d,i)=>{ const on=i%2===0; t+=d; kf.push({transform:on?"translateX("+(i%4===0?4:-4)+"px)":"translateX(0)",offset:Math.min(1,t/tot)}); });
    m.animate(kf,{duration:tot}); }
  const w=$("#wf"); if(w){ w.textContent="MX Master 4 · "+h.wf; setTimeout(()=>{ if(w.textContent.includes(h.wf)) w.textContent="Idle"; },2500); }
}
function flashKey(id){
  const c=S.features[id].fb.keypad;
  let idx=S.keymap.map((a,i)=>a===id?i:-1).filter(i=>i>=0); if(!idx.length) idx=[4];
  document.querySelectorAll(".key").forEach(k=>{

    fx.className="fx on "+(c.effect==="steady"?"":c.effect);
    clearTimeout(fx._t); fx._t=setTimeout(()=>{ fx.className="fx"; },c.dur*1000);
  });
}

/* ============ pomodoro ============ */
function initPomo(){
  const P=ui.pomo={phase:"work",round:1,run:false,away:false,left:0,t:null,awayT:null,paused:false,
    label(){ const p=S.features.pomodoro.params; return this.phase==="work"?"Focus "+this.round+" of "+p.rounds:this.phase==="short"?"Short break":"Long break"; }};
  P.left=S.features.pomodoro.params.work*60;
  P.t=setInterval(()=>{ if(remote||!P.run) return; P.left--; if(P.left<=0) pomoNext(true); pomoPaint(); },1000);
}
function pomoPaint(){ const P=ui.pomo; if(!P) return;
  const ch=$("#pchip"); if(ch) ch.textContent=P.away?"You are away":"At desk";
  const a=$("#ptime"); if(a){ a.textContent=String(Math.floor(P.left/60)).padStart(2,"0")+":"+String(P.left%60).padStart(2,"0"); $("#pphase").textContent=P.label(); const b=$("#prun"); if(b) b.textContent=P.run?"Pause":"Start"; }
  const rk=$("#railkp"); if(rk&&timerMode()) rk.innerHTML=keypadHTML("mini",false); }
function pomoNext(done){
  const P=ui.pomo, p=S.features.pomodoro.params;
  if(P.phase==="work"){ if(done) fire("pomodoro",{text:"text"}); if(P.round>=p.rounds){ P.phase="long"; P.left=p.long*60; P.round=1; } else { P.phase="short"; P.left=p.short*60; } }
  else { if(done) fire("pomodoro",{text:"text2"}); if(P.phase==="short") P.round++; P.phase="work"; P.left=p.work*60; }
  P.run=!!(done&&p.auto); pomoPaint();
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t) return; const a=t.dataset.act, id=t.dataset.id, f=id&&S.features[id];
  switch(a){
   case "go": location.hash="#/"+t.dataset.to; break;
   case "theme": S.theme={auto:"light",light:"dark",dark:"auto"}[S.theme]; applyTheme(); save(); renderSide(); break;
   case "master": S.master=!S.master; save(); renderAll(); break;
   case "toggle": setEnabled(id,!f.enabled); break;
   case "ch": f.ch[t.dataset.c]=!f.ch[t.dataset.c]; if(f.ch[t.dataset.c]) ui.tab[id]=t.dataset.c; save(); renderMain(); break;
   case "test": if(t.dataset.only) fire(id,{force:true,only:t.dataset.only,text:t.dataset.text}); else { CH.some(c=>f.ch[c])?fire(id,{force:true}):addLog(F[id].name+": no feedback type selected"); } break;
   case "sim": fire(id,{}); break;
   case "tab": ui.tab[id]=t.dataset.c; renderMain(); break;
   case "ptoggle": f.params[t.dataset.k]=!f.params[t.dataset.k]; save(); renderMain(); break;
   case "presetp": f.params[t.dataset.k]=F[id].params.find(p=>p.k===t.dataset.k).def; save(); renderMain(); break;
   case "reset-params": { const n=makeFeature(F[id]); f.params=n.params; f.cooldown=n.cooldown; save(); renderMain(); break; }
   case "reset-fb": { const n=makeFeature(F[id]); f.fb=n.fb; f.ch=n.ch; save(); renderMain(); break; }
   case "cd-reset": f.cooldown=F[id].cd.def; save(); renderMain(); break;
   case "fbset": f.fb[t.dataset.c][t.dataset.k]=t.dataset.num?+t.dataset.v:t.dataset.v; save(); renderMain(); break;
   case "sound": f.fb.audio.sound=t.dataset.v; save(); renderMain(); fire(id,{force:true,only:"audio"}); break;
   case "haptic": f.fb.haptic.pattern=t.dataset.v; save(); renderMain(); doHaptic(id); break;
   case "color": f.fb.keypad.color=t.dataset.v; save(); renderMain(); break;
   case "clearimg": f.fb[t.dataset.c].img=null; f.fb[t.dataset.c].imgName=""; save(); renderMain(); break;
   case "key": pressKey(+t.dataset.key); break;
   case "keymap-reset": S.keymap=defaults().keymap; save(); renderAll(); break;
   case "profile-apply": applyProfile(t.dataset.v); break;
   case "rec-sc": recordShortcut(id,t.dataset.k,t); break;
   case "rec-voice": toggleRecord(id); break;
   case "pomo-run": if(remote){ plugPost("/pomodoro/toggle"); break; } ui.pomo.run=!ui.pomo.run; pomoPaint(); break;
   case "pomo-skip": if(remote){ plugPost("/pomodoro/skip"); break; } pomoNext(false); break;
   case "pomo-reset": { if(remote){ plugPost("/pomodoro/reset"); break; } const P=ui.pomo; P.phase="work"; P.round=1; P.run=false; P.left=S.features.pomodoro.params.work*60; pomoPaint(); break; }
   case "pomo-away": { const P=ui.pomo, c=S.features.pomodoro.params; if(remote){ plugPost("/presence",{atDesk:P.away}); break; } P.away=!P.away;
      if(c.cam){
        if(P.away){ P.awayAt=Date.now(); P.awayBonus=0; if(P.run){ P.run=false; P.paused=true; addLog("Pomodoro <b>paused</b> (you left)"); } }
        else { const mins=((Date.now()-P.awayAt)+P.awayBonus)/60000;
          if(mins>=c.reset){ P.phase="work"; P.round=1; P.left=c.work*60; P.run=!!P.paused; P.paused=false; addLog("Pomodoro <b>reset</b> (away "+Math.round(mins)+" min)"); }
          else if(P.paused){ P.paused=false; P.run=true; addLog("Pomodoro <b>resumed</b> (you are back)"); } } }
      pomoPaint(); renderMain(); break; }
   case "pomo-away5": { if(remote){ plugPost("/pomodoro/demo-away"); break; } const P=ui.pomo; P.awayBonus+=S.features.pomodoro.params.reset*60000; addLog("Demo: pretend "+S.features.pomodoro.params.reset+" min passed"); t.textContent="Done. Now press “I am back”"; break; }
   case "tkey": { const P=ui.pomo, k=t.dataset.t;
      if(remote){ if(k==="run"&&!(P.away&&S.features.pomodoro.params.cam)) plugPost("/pomodoro/toggle"); if(k==="skip") plugPost("/pomodoro/skip"); if(k==="reset") plugPost("/pomodoro/reset"); break; }
      if(k==="run"&&!(P.away&&S.features.pomodoro.params.cam)){ P.run=!P.run; pomoPaint(); }
      if(k==="skip") pomoNext(false);
      if(k==="reset"){ P.phase="work"; P.round=1; P.run=false; P.left=S.features.pomodoro.params.work*60; pomoPaint(); }
      break; }
   case "demo-start": if(demo.run){ demo.at=demoElapsed(); demo.run=false; clearInterval(demo.timer); } else { demo.t0=Date.now(); demo.run=true; clearInterval(demo.timer); demo.timer=setInterval(demoPaint,500); } demoPaint(); break;
   case "demo-reset": demo.lastK=-1; demo.run=false; demo.at=0; clearInterval(demo.timer); demoPaint(); break;
   case "demo-jump": demo.lastK=-1; demo.at=DEMO[+t.dataset.i].t; demo.t0=Date.now(); if(!demo.run){ demo.run=true; clearInterval(demo.timer); demo.timer=setInterval(demoPaint,500); } demoPaint(); break;
   case "demo-do": if(t.dataset.d==="go-dash") location.hash="#/"; else if(t.dataset.d==="go-brightness") location.hash="#/f/brightness"; else demoDo(t.dataset.d); break;
   case "demo-check": demoCheck(); break;
   case "bh-sim": bhRun(t.dataset.s); break;
   case "bh-do": fetch("/behind/do/"+t.dataset.a,{method:"POST"}).then(()=>pollBehind()).catch(()=>{}); break;
   case "far-away": { ui.farAway=!ui.farAway; plugPost("/presence",{atDesk:!ui.farAway}); t.textContent=ui.farAway?"I am back":"I leave the frame"; break; }
   case "export": { const b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}), u=URL.createObjectURL(b), l=document.createElement("a"); l.href=u; l.download="desk-coach-settings.json"; l.click(); setTimeout(()=>URL.revokeObjectURL(u),1000); break; }
   case "wipe": if(confirm("Reset all Desk Coach settings?")){ S=defaults(); save(); renderAll(); } break;
  }
});
document.addEventListener("input",e=>{
  const t=e.target, a=t.dataset.act; if(!a) return; const id=t.dataset.id, f=id&&S.features[id];
  if(a==="prange"){ const p=F[id].params.find(p=>p.k===t.dataset.k); f.params[p.k]=+t.value; t.nextElementSibling.textContent=fmtP(p,t.value); const rs=t.parentElement.querySelector(".rs"); if(rs) rs.classList.toggle("chg",+t.value!==p.def); save(); }
  if(a==="cd"){ f.cooldown=+t.value; $("#cdout").textContent=fmtT(f.cooldown); t.parentElement.querySelector(".rs").classList.toggle("chg",f.cooldown!==F[id].cd.def); save(); }
  if(a==="fbnum"){ f.fb[t.dataset.c][t.dataset.k]=+t.value; t.nextElementSibling.textContent=t.value+t.dataset.unit; save(); }
  if(a==="fbtext"){ f.fb.screen.texts[t.dataset.k]=t.value; save(); }
  if(a==="colorin"){ f.fb.keypad.color=t.value; save(); }
  if(a==="farsim"){ ui.farRatio=+t.value; const o=$("#farout"); if(o) o.textContent=t.value+" %"; farSend(); }
});
document.addEventListener("change",e=>{
  const t=e.target, a=t.dataset.act; if(!a) return; const id=t.dataset.id, f=id&&S.features[id];
  if(a==="psel"){ f.params[t.dataset.k]=t.value; save(); renderMain(); }
  if(a==="fbsel"){ f.fb[t.dataset.c][t.dataset.k]=t.value; save(); }
  if(a==="profile"){ if(t.value!=="custom") applyProfile(t.value); }
  if(a==="keymap"){ S.keymap[+t.dataset.i]=t.value; save(); renderAll(); }
  if(a==="colorin") renderMain();
  if(a==="file"&&t.files[0]){ const file=t.files[0], k=t.dataset.t;
    readFile(file,url=>{ const c=f.fb[k]; if(k==="audio"){ c.file=url; c.fname=file.name; } else { c.img=url; c.imgName=file.name; } if(url.length>1500000) saveWarn=true; save(); renderMain(); }); }
  if(a==="import"&&t.files[0]){ t.files[0].text().then(x=>{ try{ S=merge(defaults(),JSON.parse(x)); save(); applyTheme(); renderAll(); }catch(err){ alert("That file is not valid settings JSON."); } }); }
});

/* ---- shortcut + voice recording ---- */
function recordShortcut(id,k,btn){
  btn.textContent="Press keys…"; const out=$("#sc-"+id+"-"+k);
  const h=ev=>{ ev.preventDefault();
    if(ev.key==="Escape"){ done(S.features[id].params[k]); return; }
    if(["Meta","Control","Alt","Shift"].includes(ev.key)) return;
    const parts=[ev.metaKey&&"⌘",ev.ctrlKey&&"Ctrl",ev.altKey&&"⌥",ev.shiftKey&&"⇧",ev.key.length===1?ev.key.toUpperCase():ev.key].filter(Boolean);
    if(parts.length<2&&!/^F\d+$/.test(parts[0])){ return; } const v=parts.join(" "); S.features[id].params[k]=v; save(); done(v); };
  const done=v=>{ removeEventListener("keydown",h,true); out.textContent=v; btn.textContent="Record"; };
  addEventListener("keydown",h,true);
}
async function toggleRecord(id){
  const err=()=>$("#recerr");
  if(ui.rec&&ui.rec.id===id){ ui.rec.mr.stop(); return; }
  if(!navigator.mediaDevices||!window.MediaRecorder){ if(err()) err().textContent="Recording is not supported in this browser."; return; }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true}), mr=new MediaRecorder(stream), chunks=[];
    mr.ondataavailable=e=>chunks.push(e.data);
    mr.onstop=()=>{ stream.getTracks().forEach(t=>t.stop()); readFile(new Blob(chunks,{type:mr.mimeType}),url=>{ S.features[id].fb.audio.rec=url; ui.rec=null; save(); renderMain(); }); };
    ui.rec={id,mr}; mr.start(); renderMain();
    setTimeout(()=>{ if(ui.rec&&ui.rec.mr===mr&&mr.state==="recording") mr.stop(); },15000);
  }catch(e){ ui.rec=null; renderMain(); if(err()) err().textContent="Microphone access was blocked. Allow it in the browser to record."; }
}
function applyTheme(){ if(S.theme==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme",S.theme); }

/* public hook for the real detectors */
window.DeskCoach={ trigger:(id,text)=>F[id]?fire(id,{text:text||"text"}):false, state:()=>S };
applyTheme(); initPomo(); route(); connect();
</script>
