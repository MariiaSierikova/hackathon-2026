[project]
name = "work-health-coach-brain"
version = "0.1.0"
description = "Camera/mic analysis that sends triggers to the WorkHealthCoach Logi plugin"
requires-python = ">=3.10,<3.13"
dependencies = [
    "paramiko>=3.0",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "sounddevice>=0.4.6",
    "scipy>=1.10.0",
    "pyobjc-framework-cocoa>=12.2.2 ; sys_platform == 'darwin'",
    "pyside6-essentials>=6.12.0",
]

[tool.uv]
package = false
